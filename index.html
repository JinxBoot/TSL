<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TSL — Teach Select Learn (Static Demo)</title>

    <!-- ensure the demo's own CSS is available for correct styling -->
    <link rel="stylesheet" href="/static/styles.css" />

    <style>
      /* make the iframe take the full viewport */
      html, body { height: 100%; margin: 0; }
      .demo-frame { width: 100%; height: 100vh; border: 0; display: block; }
      .fallback { padding: 2rem; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
    </style>
  </head>
  <body>
    <!-- embed the static demo; all scripts and styles inside index-static.html will run inside the iframe -->
    <iframe class="demo-frame" src="/index-static.html" title="TSL Static Demo">
      <div class="fallback">
      </div>
    </iframe>
  </body>
</html>
